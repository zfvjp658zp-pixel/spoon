<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOON SETLIST</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:26px 16px 80px}a{color:inherit}.head{text-align:center;padding:12px 0 28px}.head h1{margin:0;font-size:28px;letter-spacing:5px}.head p{color:#666;font-size:11px;letter-spacing:4px}
.links{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}.links a{border:1px solid #333;border-radius:30px;padding:10px 15px;text-decoration:none;color:#aaa;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #292929;margin:0 -16px 28px}.stat{text-align:center;padding:24px 4px;border-right:1px solid #292929}.stat:last-child{border:0}.stat b{display:block;font-size:30px}.stat small{color:#555;letter-spacing:2px}
.search{display:flex;gap:10px;margin-bottom:22px}input,textarea{width:100%;background:#111;color:#eee;border:1px solid #333;border-radius:25px;padding:12px 16px;font:inherit;outline:0}textarea{min-height:85px;border-radius:14px}.filter,.addbtn,.save,.delete{font:inherit;border-radius:24px;padding:10px 15px;border:1px solid #333;background:#111;color:#aaa}.filter.active{color:#ff7640;border-color:#ff7640}
.section{padding:15px 5px;border-bottom:1px solid #222;color:#777;letter-spacing:3px}.year{margin-top:36px}.yeartitle{display:flex;gap:15px;align-items:center;color:#555;letter-spacing:5px}.yeartitle:after{content:"";height:1px;background:#292929;flex:1}
.month{margin:24px 0;border:1px solid #292929;border-radius:15px;background:#111;overflow:hidden}.monthhead{padding:23px 20px}.monthname{font-size:23px;font-weight:700}.count{color:#555;margin-top:7px}.ranks{display:grid;grid-template-columns:1fr 1fr;gap:25px;border-top:1px solid #242424;margin-top:20px;padding-top:18px}.rt{color:#555;font-size:10px;letter-spacing:3px}.rank{display:flex;gap:8px;margin:8px 0;font-size:13px}.rank .n{color:#555;width:17px}.rank .c{margin-left:auto;color:#555}
.stream{border-top:1px solid #242424}.streamhead{display:grid;grid-template-columns:50px 1fr 40px;align-items:center;padding:19px 20px;cursor:pointer}.no{color:#555}.stitle{font-size:17px;font-weight:700}.scount{font-size:13px;color:#555;margin-top:5px}.arrow{width:36px;height:36px;border:1px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#777}.streambody{display:none;padding:0 20px 22px 70px}.stream.open .streambody{display:block}.overview{background:#0b0b0b;border-radius:10px;padding:14px;color:#aaa;white-space:pre-wrap;line-height:1.7;margin-bottom:10px}.song{padding:13px 0;border-bottom:1px solid #202020}.songno{font-size:11px;color:#555}.songname{font-size:17px;margin-top:4px}.artist{font-size:13px;color:#555;margin-top:4px}.time{font-size:11px;color:#777;margin-top:7px}.songlinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.songlinks a{font-size:11px;text-decoration:none;border:1px solid #333;border-radius:20px;padding:6px 10px;color:#aaa}
.addbox{margin-top:50px;border:1px solid #292929;border-radius:15px;background:#101010;padding:20px}.addbox h2{font-size:17px}.field{margin:10px 0}label{display:block;color:#666;font-size:11px;margin:0 0 5px 4px}.songinput{border:1px solid #292929;border-radius:12px;padding:12px;margin:10px 0}.songinput input{margin:4px 0}.delete{color:#d88;border-color:#533;margin-top:7px}.save{width:100%;margin-top:10px;background:#eee;color:#111}.empty{text-align:center;color:#555;padding:40px}
@media(max-width:550px){.ranks{grid-template-columns:1fr}.search{flex-direction:column}.filter{padding:11px}.streambody{padding-left:58px}}
</style>
</head>
<body><main>
<header class="head"><h1>SPOON SETLIST</h1><p>SETLIST RECORD</p></header>
<nav class="links">
<a href="https://www.spooncast.net/" target="_blank">Spoon</a><a href="https://www.youtube.com/" target="_blank">YouTube</a><a href="https://x.com/" target="_blank">X</a><a href="https://twitcasting.tv/" target="_blank">Twitcast</a><a href="#">Membership</a><a href="#">lit.link</a>
</nav>
<section class="stats"><div class="stat"><b id="streams">0</b><small>streams</small></div><div class="stat"><b id="songs">0</b><small>songs total</small></div><div class="stat"><b id="updated">----</b><small>updated</small></div></section>
<div class="search"><input id="search" placeholder="🔍 曲名・アーティスト名で検索"><button id="filter" class="filter">● replayあり</button></div>
<div class="section">🎵 よく歌う曲 TOP 10</div><div id="top"></div><div id="months"></div>
<section class="addbox"><h2>＋ 配信を追加</h2>
<div class="field"><label>配信日</label><input id="date" type="date"></div>
<div class="field"><label>配信タイトル</label><input id="title" placeholder="配信タイトル"></div>
<div class="field"><label>概要</label><textarea id="overview" placeholder="この配信の概要"></textarea></div>
<div id="songInputs"></div>
<button class="addbtn" id="addSong">＋ 曲を追加</button><button class="save" id="saveStream">この配信を保存</button>
</section>
</main>
<script>
const KEY="spoonSetlistV2";let data=JSON.parse(localStorage.getItem(KEY)||"[]"),replayOnly=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function safeUrl(v){try{let u=new URL(v);return/^https?:$/.test(u.protocol)?u.href:"#"}catch{return"#"}}
function addSongInput(){
 const d=document.createElement("div");d.className="songinput";
 d.innerHTML='<input class="sn" placeholder="曲名"><input class="sa" placeholder="アーティスト名"><input class="sr" placeholder="SpoonリプレイURL"><input class="sv" placeholder="動画URL（任意）"><input class="st" placeholder="タイムスタンプ（任意）"><button class="delete">この曲を削除</button>';
 d.querySelector(".delete").onclick=()=>d.remove();$("songInputs").appendChild(d);
}
function saveStream(){
 const date=$("date").value,title=$("title").value.trim();if(!date||!title){alert("配信日とタイトルを入力してください");return}
 const songs=[...document.querySelectorAll(".songinput")].map(d=>({name:d.querySelector(".sn").value.trim(),artist:d.querySelector(".sa").value.trim(),replay:d.querySelector(".sr").value.trim(),video:d.querySelector(".sv").value.trim(),time:d.querySelector(".st").value.trim()})).filter(x=>x.name);
 data.push({date,title,overview:$("overview").value.trim(),songs});data.sort((a,b)=>b.date.localeCompare(a.date));localStorage.setItem(KEY,JSON.stringify(data));
 $("date").value=$("title").value=$("overview").value="";$("songInputs").innerHTML="";addSongInput();render();
}
function ranking(list){return Object.entries(list).sort((a,b)=>b[1]-a[1]).slice(0,3).map((x,i)=>`<div class="rank"><span class="n">${i+1}</span><span>${esc(x[0])}</span><span class="c">×${x[1]}</span></div>`).join("")}
function stats(list){let songs={},artists={};list.forEach(s=>s.songs.forEach(x=>{songs[x.name]=(songs[x.name]||0)+1;if(x.artist)artists[x.artist]=(artists[x.artist]||0)+1}));return{songs,artists}}
function render(){
 const q=$("search").value.toLowerCase().trim();$("streams").textContent=data.length;$("songs").textContent=data.reduce((n,s)=>n+s.songs.length,0);$("updated").textContent=new Date().toISOString().slice(0,10).replaceAll("-","/");
 let all={};data.forEach(s=>s.songs.forEach(x=>all[x.name]=(all[x.name]||0)+1));let top=Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,10);
 $("top").innerHTML=top.length?top.map((x,i)=>`<div class="rank" style="padding:9px 5px;border-bottom:1px solid #181818"><span class="n">${i+1}</span><span>${esc(x[0])}</span><span class="c">×${x[1]}</span></div>`).join(""):'<div class="empty">まだ曲がありません</div>';
 let groups={};data.forEach(s=>{let songs=s.songs.filter(x=>(!q||x.name.toLowerCase().includes(q)||(x.artist||"").toLowerCase().includes(q))&&(!replayOnly||x.replay));if((q||replayOnly)&&!songs.length)return;(groups[s.date.slice(0,7)]??=[]).push({...s,songs})});
 const names=["","January","February","March","April","May","June","July","August","September","October","November","December"];let html="";
 Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(k=>{let year=k.slice(0,4),mo=+k.slice(5),list=groups[k],total=list.reduce((n,s)=>n+s.songs.length,0),c=stats(list);
 html+=`<div class="year"><div class="yeartitle">${year}</div><div class="month"><div class="monthhead"><div class="monthname">${names[mo]} — ${mo}月</div><div class="count">${list.length} streams · ${total} songs</div><div class="ranks"><div><div class="rt">TOP ARTISTS</div>${ranking(c.artists)}</div><div><div class="rt">TOP SONGS</div>${ranking(c.songs)}</div></div></div>`;
 list.forEach((s,i)=>{html+=`<div class="stream"><div class="streamhead"><div class="no">#${String(i+1).padStart(2,"0")}</div><div><div class="stitle">${esc(s.title)}</div><div class="scount">${s.songs.length} songs</div></div><div class="arrow">▼</div></div><div class="streambody">${s.overview?`<div class="overview">${esc(s.overview)}</div>`:""}${s.songs.map((x,n)=>`<div class="song"><div class="songno">${n+1}</div><div class="songname">${esc(x.name)}</div>${x.artist?`<div class="artist">${esc(x.artist)}</div>`:""}${x.time?`<div class="time">${esc(x.time)}</div>`:""}<div class="songlinks">${x.replay?`<a href="${safeUrl(x.replay)}" target="_blank" rel="noopener">▶ Spoonリプレイ</a>`:""}${x.video?`<a href="${safeUrl(x.video)}" target="_blank" rel="noopener">🎬 動画</a>`:""}</div></div>`).join("")}</div></div>`});html+="</div></div>"});
 $("months").innerHTML=html||'<div class="empty">まだ配信がありません</div>';
 document.querySelectorAll(".streamhead").forEach(h=>h.onclick=()=>{let s=h.parentElement;s.classList.toggle("open");h.querySelector(".arrow").textContent=s.classList.contains("open")?"▲":"▼"});
}
$("addSong").onclick=addSongInput;$("saveStream").onclick=saveStream;$("filter").onclick=()=>{replayOnly=!replayOnly;$("filter").classList.toggle("active",replayOnly);render()};$("search").oninput=render;addSongInput();render();
</script></body></html>
