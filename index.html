<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spoon Setlist</title>

<style>
body{
  margin:0;
  background:#f7f7f7;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  color:#222;
}
main{
  max-width:600px;
  margin:auto;
  padding:24px 16px 50px;
}
h1{
  text-align:center;
}
.box,.setlist{
  background:white;
  border-radius:16px;
  padding:18px;
  margin:16px 0;
  box-shadow:0 2px 8px #ddd;
}
input,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}
textarea{
  min-height:100px;
  resize:vertical;
}
button{
  background:#222;
  color:white;
  border:0;
}
.song{
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.song:last-child{
  border-bottom:0;
}
.song b{
  font-size:17px;
}
.num{
  color:#999;
  margin-right:6px;
}
a{
  display:inline-block;
  margin-top:6px;
  color:#555;
}
.overview{
  white-space:pre-wrap;
  background:#f5f5f5;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}
.delete{
  background:#c33;
}
</style>
</head>

<body>

<main>

<h1>SPOON SETLIST</h1>

<div class="box">
  <input id="setTitle" placeholder="セトリのタイトル">
  <textarea id="setOverview" placeholder="このセトリの概要"></textarea>
  <button onclick="createSetlist()">＋このセトリを作成</button>
</div>

<div id="setlists"></div>

</main>

<script>

let setlists = JSON.parse(localStorage.getItem("spoonSetlists") || "[]");

function save(){
  localStorage.setItem("spoonSetlists",JSON.stringify(setlists));
}

function createSetlist(){

  const title=document.getElementById("setTitle").value.trim();
  const overview=document.getElementById("setOverview").value.trim();

  if(!title){
    alert("セトリのタイトルを入力してください");
    return;
  }

  setlists.push({
    title:title,
    overview:overview,
    songs:[]
  });

  document.getElementById("setTitle").value="";
  document.getElementById("setOverview").value="";

  save();
  render();
}

function addSong(index){

  const name=document.getElementById("name"+index).value.trim();
  const replay=document.getElementById("replay"+index).value.trim();
  const video=document.getElementById("video"+index).value.trim();

  if(!name){
    alert("曲名を入力してください");
    return;
  }

  setlists[index].songs.push({
    name:name,
    replay:replay,
    video:video
  });

  save();
  render();
}

function deleteSetlist(index){

  if(confirm("このセトリを削除しますか？")){
    setlists.splice(index,1);
    save();
    render();
  }
}

function render(){

  const area=document.getElementById("setlists");
  area.innerHTML="";

  setlists.forEach((set,index)=>{

    let html=`
      <div class="setlist">

        <h2>${escapeHtml(set.title)}</h2>

        ${
          set.overview
          ? `<div class="overview">${escapeHtml(set.overview)}</div>`
          : ""
        }

        <h3>セトリ</h3>
    `;

    set.songs.forEach((song,i)=>{

      html+=`
        <div class="song">
          <b>
            <span class="num">${i+1}.</span>
            ${escapeHtml(song.name)}
          </b>
          <br>
          ${
            song.replay
            ? `<a href="${escapeAttr(song.replay)}" target="_blank">▶ Spoonリプレイ</a>`
            : ""
          }
          ${
            song.video
            ? `<br><a href="${escapeAttr(song.video)}" target="_blank">🎬 動画</a>`
            : ""
          }
        </div>
      `;

    });

    html+=`

        <input id="name${index}" placeholder="曲名">
        <input id="replay${index}" placeholder="SpoonリプレイURL">
        <input id="video${index}" placeholder="動画URL（任意）">

        <button onclick="addSong(${index})">
          ＋曲を追加
        </button>

        <button class="delete" onclick="deleteSetlist(${index})">
          このセトリを削除
        </button>

      </div>
    `;

    area.innerHTML+=html;

  });

}

function escapeHtml(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(str){
  return escapeHtml(str);
}

render();

</script>

</body>
</html>
